# Publica server.json en el registro oficial de MCP (registry.modelcontextprotocol.io)
# bajo el espacio com.publicit, verificado por DNS (TXT en publicit.com).
#
# Se lanza a mano (o desde scripts/publicar-registro.sh) después de desplegar el
# dashboard: el registro anuncia la versión de server.json, que tiene que ser la que
# sirve producción. La clave privada Ed25519 vive en el secreto MCP_PRIVATE_KEY.
name: Publish to MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Versión fijada a propósito (no `latest`); si el registro responde "invalid
  # audience", subirla.
  MCP_PUBLISHER_VERSION: v1.8.1

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher (checksum verified)
        run: |
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" "$base_url/$archive"
          curl -fsSL -o checksums.txt "$base_url/registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" mcp-publisher

      - name: Check the DNS proof is published
        run: dig TXT publicit.com +short | grep -q 'v=MCPv1; k=ed25519' || { echo "Missing TXT v=MCPv1 on publicit.com"; exit 1; }

      - name: Log in (DNS, publicit.com)
        run: ./mcp-publisher login dns --domain publicit.com --private-key "${{ secrets.MCP_PRIVATE_KEY }}"

      - name: Publish server.json
        run: ./mcp-publisher publish

      - name: Show the registry entry
        run: curl -fsS 'https://registry.modelcontextprotocol.io/v0/servers?search=com.publicit/mcp'
